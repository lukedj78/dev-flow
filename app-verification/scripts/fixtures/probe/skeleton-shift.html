<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>probe: skeleton shift</title>
<style>
  body { margin: 0; font: 16px/1.5 system-ui, sans-serif; padding: 16px; }
  .skeleton { height: 40px; background: #eee; border-radius: 8px; }
  .card { height: 320px; background: #ddd; }
</style></head>
<body>
  <h1>Orders</h1>
  <!-- A guessed skeleton: one 40px bar where the loaded list is 320px tall — everything below jumps. -->
  <div id="list"><div class="skeleton"></div></div>
  <!-- What sits under the list on a real page: totals, filters, the next section — a large area that jumps. -->
  <section id="below" style="height: 500px; background: #f4f4f4">Totals and the next page sit under the list.</section>
  <script>
    setTimeout(() => { document.getElementById("list").innerHTML = '<div class="card">Twelve orders</div>'; }, 300);
  </script>
</body></html>
