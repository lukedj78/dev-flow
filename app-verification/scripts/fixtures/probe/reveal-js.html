<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>probe: reveal by class</title>
<style>
  body { margin: 0; font: 16px/1.5 system-ui, sans-serif; padding: 16px; }
  .reveal { opacity: 0; transition: opacity 150ms; }
  .reveal.in { opacity: 1; }
</style></head>
<body>
  <h1>Reveal on scroll</h1>
  <!-- The usual IntersectionObserver / AOS shape: the class is added only when motion is allowed,
       so with reduced motion the paragraph stays at opacity 0 — and its class list differs between the two loads. -->
  <p class="reveal">Shown by a class that script adds.</p>
  <script>
    if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {
      document.querySelectorAll(".reveal").forEach((el) => el.classList.add("in"));
    }
  </script>
</body></html>
