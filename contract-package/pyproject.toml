[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dev-flow-contract"
version = "0.1.0"
description = "Filesystem contract for agent-driven SDLC. Underpins the dev-flow Claude Code skills."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Luca Di Gerlando" }]
keywords = ["dev-flow", "agent", "sdlc", "claude-code", "skills", "filesystem-contract"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/lukedj78/dev-flow"
Repository = "https://github.com/lukedj78/dev-flow"
Issues = "https://github.com/lukedj78/dev-flow/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
