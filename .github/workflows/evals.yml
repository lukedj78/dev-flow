name: evals

on:
  push:
    branches: [main]
  pull_request:

jobs:
  property-evals:
    name: Property-based evals
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install Pillow numpy scikit-learn pyyaml

      - name: Generate synthetic fixtures
        run: python3 evals/image-to-design-md/fixtures/gen_synthetic.py

      - name: Run evals (CI mode — fail on first regression)
        run: python3 evals/run_evals.py --ci

      # The output-side checker. Its own fixtures are the test: every check must fire
      # on fixtures/bad and stay silent on fixtures/good, because a check that does
      # neither is indistinguishable from a clean run.
      - name: Self-test the generated-page checks
        run: python3 evals/generated-page/check.py --selftest

      # append-history used to accept an unknown phase, write it into history and
      # silently skip the bump — a success line over a project that had not moved.
      - name: append-history must reject a phase that does not exist
        run: |
          rm -rf /tmp/phase-smoke && mkdir -p /tmp/phase-smoke
          python3 dev-flow/scripts/init_workflow.py /tmp/phase-smoke --name "Phase"
          # leaving idea_captured needs an inventory on record; this step is about phase handling, not about that
          python3 dev-flow/scripts/inventory.py record /tmp/phase-smoke --verdict skipped --reason "smoke test of phase handling"
          if python3 dev-flow/scripts/update_meta.py /tmp/phase-smoke \
               append-history --skill smoke --phase-after not_a_phase; then
            echo "ERROR: append-history accepted an unknown phase"
            exit 1
          fi
          python3 dev-flow/scripts/update_meta.py /tmp/phase-smoke \
            append-history --skill smoke --phase-after tasks_split
          python3 -c "import json;m=json.load(open('/tmp/phase-smoke/.workflow/meta.json'));assert m['phase']=='tasks_split',m['phase'];assert 'not_a_phase' not in [h.get('phase_after') for h in m['history']],'an unknown phase reached history'"

      # The inventory gate: a project does not leave idea_captured without an inventory on record,
      # through set-phase and through append-history --phase-after (the back door).
      - name: The inventory gate refuses to leave idea_captured without an inventory
        run: |
          rm -rf /tmp/inv-smoke && mkdir -p /tmp/inv-smoke
          python3 dev-flow/scripts/init_workflow.py /tmp/inv-smoke --name "Inv"
          if python3 dev-flow/scripts/update_meta.py /tmp/inv-smoke set-phase prd_drafted; then
            echo "ERROR: set-phase left idea_captured with no inventory"; exit 1
          fi
          if python3 dev-flow/scripts/update_meta.py /tmp/inv-smoke append-history --skill smoke --phase-after prd_drafted; then
            echo "ERROR: append-history is a back door around the inventory gate"; exit 1
          fi
          if python3 dev-flow/scripts/inventory.py record /tmp/inv-smoke --verdict skipped; then
            echo "ERROR: a skipped inventory was accepted without a reason"; exit 1
          fi
          python3 dev-flow/scripts/inventory.py record /tmp/inv-smoke --verdict build --searched skills projects
          python3 dev-flow/scripts/update_meta.py /tmp/inv-smoke set-phase prd_drafted
          python3 -c "import json;m=json.load(open('/tmp/inv-smoke/.workflow/meta.json'));assert m['phase']=='prd_drafted',m['phase'];assert m['inventory']['verdict']=='build'"

      - name: Smoke-test artifact hashing + drift detection
        run: |
          mkdir -p /tmp/drift-smoke
          python3 dev-flow/scripts/init_workflow.py /tmp/drift-smoke --name "Smoke"
          echo "test" > /tmp/drift-smoke/.workflow/DESIGN.md
          python3 dev-flow/scripts/update_meta.py /tmp/drift-smoke record-artifact \
            --path .workflow/DESIGN.md --produced-by smoke-test
          python3 dev-flow/scripts/check_drift.py /tmp/drift-smoke --exit-nonzero-on-drift
          # Now mutate and confirm drift is detected
          echo "edited" > /tmp/drift-smoke/.workflow/DESIGN.md
          if python3 dev-flow/scripts/check_drift.py /tmp/drift-smoke --exit-nonzero-on-drift; then
            echo "ERROR: check_drift should have detected the edit"
            exit 1
          fi
          echo "OK: drift correctly detected after edit"
