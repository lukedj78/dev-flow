name: lint-skills

on:
  push:
    branches: [main]
    paths:
      - "*/SKILL.md"
      - "*/references/**"
      - "install.sh"
      - "uninstall.sh"
      - "scripts/lint_skills.py"
      - "scripts/build_skills_registry.py"
      - "scripts/build_agent_plugin.py"
      - "scripts/build_site.py"
      - "docs/index.html"
      - "docs/skills/**"
      # Checks 10 and 11 READ these three. Without them here, editing the
      # README could break the lint and CI would never run — which is exactly
      # what those checks exist to prevent.
      - "README.md"
      - "CONTEXT.md"
      - "docs/dev-flow-skill-map.html"
      # The generated artefacts themselves. CI asserts these are in sync with
      # their sources, so a hand-edit or a bad merge that touches ONLY a
      # generated file must still be checked — otherwise the check that owns
      # the file is the one thing that never sees it.
      - "skills.json"
      - ".claude-plugin/**"
      # Every skill's scripts: run_skill_tests.py runs each <skill>/scripts/test_*.py it finds,
      # so a change to any script folder must run them. Naming folders one by one is how CI
      # came to run 4 of 17 test files.
      - "*/scripts/**"
      # What goes into dist/<skill>.skill, the bundles themselves, and their builder:
      # build_skill_bundles.py --check compares the committed bundles with the sources.
      - "*/assets/**"
      - "dist/*.skill"
      - "scripts/build_skill_bundles.py"
      # the compliance grader reads the gates' scripts above; its selftest runs on either change
      - "evals/compliance/**"
      - ".github/workflows/lint-skills.yml"
  pull_request:
    paths:
      - "*/SKILL.md"
      - "*/references/**"
      - "install.sh"
      - "uninstall.sh"
      - "scripts/lint_skills.py"
      - "scripts/build_skills_registry.py"
      - "scripts/build_agent_plugin.py"
      - "scripts/build_site.py"
      - "docs/index.html"
      - "docs/skills/**"
      # Checks 10 and 11 READ these three. Without them here, editing the
      # README could break the lint and CI would never run — which is exactly
      # what those checks exist to prevent.
      - "README.md"
      - "CONTEXT.md"
      - "docs/dev-flow-skill-map.html"
      # The generated artefacts themselves. CI asserts these are in sync with
      # their sources, so a hand-edit or a bad merge that touches ONLY a
      # generated file must still be checked — otherwise the check that owns
      # the file is the one thing that never sees it.
      - "skills.json"
      - ".claude-plugin/**"
      # Every skill's scripts: run_skill_tests.py runs each <skill>/scripts/test_*.py it finds,
      # so a change to any script folder must run them. Naming folders one by one is how CI
      # came to run 4 of 17 test files.
      - "*/scripts/**"
      # What goes into dist/<skill>.skill, the bundles themselves, and their builder:
      # build_skill_bundles.py --check compares the committed bundles with the sources.
      - "*/assets/**"
      - "dist/*.skill"
      - "scripts/build_skill_bundles.py"
      # the compliance grader reads the gates' scripts above; its selftest runs on either change
      - "evals/compliance/**"
      - ".github/workflows/lint-skills.yml"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Lint all skills
        run: python3 scripts/lint_skills.py

      # One step for every suite: run_skill_tests.py discovers each <skill>/scripts/test_*.py tracked
      # by git, fails on a red suite and on one that ran zero tests, and prints the skips. CI used to
      # name the files one by one and ran 4 of 17.
      - name: Run every skill's test suite
        run: python3 scripts/run_skill_tests.py

      - name: Self-test the compliance grader (offline — the agent runs are local and paid)
        run: python3 evals/compliance/comply.py selftest

      - name: Regenerate skills.json and check it's committed
        run: |
          python3 scripts/build_skills_registry.py
          # Exclude the auto-changing "generated_at" timestamp from the diff —
          # only structural changes (skill list, counts, etc.) should fail CI.
          if ! git diff -I '"generated_at":' --quiet skills.json; then
            echo "::error::skills.json is out of date. Run scripts/build_skills_registry.py and commit the result."
            git diff -I '"generated_at":' skills.json | head -40
            exit 1
          fi
          echo "✓ skills.json is up to date (structurally)."

      - name: Build the Agent Plugins package and check its manifest
        run: python3 scripts/build_agent_plugin.py --check

      # Only the pre-commit hook rebuilt the bundles, and it runs only in clones that installed it.
      # On 2026-10-03 twelve of fifty-one were wrong. This compares their content with the sources.
      - name: Check the dist/*.skill bundles match their sources
        run: python3 scripts/build_skill_bundles.py --check

      - name: Check the published site is regenerated
        run: |
          # The site is generated from skills.json + the SKILL.md frontmatter.
          # Adding a skill without re-running this leaves a page missing from
          # lukedj78.github.io/dev-flow — invisible until someone looks for it.
          if ! python3 scripts/build_site.py --check; then
            echo "::error::docs/ site is stale. Run scripts/build_site.py and commit the result."
            exit 1
          fi
